<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Review Analyzer</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      width: 380px;
      background: #faf8f5;
      color: #111;
      font-size: 13px;
    }

    header {
      padding: 16px 18px;
      background: #faf8f5;
      border-bottom: 2px solid #111;
    }

    header h1 {
      font-size: 15px;
      font-weight: 700;
      color: #111;
      letter-spacing: -0.3px;
    }

    header p {
      font-size: 11px;
      color: #999;
      margin-top: 2px;
    }

    .body { padding: 14px; }

    #analyze-btn {
      width: 100%;
      padding: 11px;
      background: #111;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      font-weight: 600;
      letter-spacing: 0.2px;
      transition: opacity 0.2s;
    }

    #analyze-btn:hover { opacity: 0.8; }
    #analyze-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    #loading {
      text-align: center;
      padding: 24px;
      font-size: 12px;
      color: #999;
      display: none;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #e8e4de;
      border-top-color: #111;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #results { display: none; margin-top: 14px; }

    .card {
      background: #fff;
      border: 1.5px solid #e8e4de;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .card-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #333;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .trust-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #f5f0ea;
      font-size: 12px;
      color: #444;
    }

    .trust-row:last-child { border-bottom: none; }

    .pill {
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      font-family: 'DM Mono', monospace;
    }

    .pill-real       { background: #f0fdf4; color: #16a34a; }
    .pill-fake       { background: #fef2f2; color: #dc2626; }
    .pill-suspicious { background: #fffbeb; color: #d97706; }
    .pill-positive   { background: #f0fdf4; color: #16a34a; }
    .pill-negative   { background: #fef2f2; color: #dc2626; }
    .pill-neutral    { background: #f5f5f5; color: #888; }

    .sentiment-row { margin-bottom: 10px; }
    .sentiment-row:last-child { margin-bottom: 0; }

    .sentiment-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 5px;
      font-weight: 600;
    }

    .sent-pos { color: #16a34a; }
    .sent-neg { color: #dc2626; }
    .sent-pct { font-family: 'DM Mono', monospace; font-weight: 700; }

    .bar-bg {
      background: #ede9e3;
      border-radius: 4px;
      height: 7px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.8s cubic-bezier(0.4,0,0.2,1);
    }

    .bar-positive { background: linear-gradient(90deg, #16a34a, #4ade80); }
    .bar-negative { background: linear-gradient(90deg, #dc2626, #f87171); }

    #summary-btn {
      width: 100%;
      padding: 9px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    #summary-btn:hover { opacity: 0.8; }
    #summary-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    #summary-loading {
      font-size: 11px;
      color: #999;
      margin-top: 10px;
      display: none;
      text-align: center;
    }

    #summary-text {
      font-size: 12px;
      line-height: 1.7;
      color: #444;
      margin-top: 10px;
    }

    /* each review is its own mini card */
    .review-item {
      background: #fff;
      border: 1.5px solid #e8e4de;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }

    .review-item:last-child { margin-bottom: 0; }

    .review-meta {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
    }

    .review-text {
      color: #555;
      line-height: 1.6;
      font-size: 12px;
    }

    .review-text.collapsed {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .read-more {
      color: #4f6ef7;
      cursor: pointer;
      font-size: 11px;
      margin-top: 4px;
      display: inline-block;
      font-weight: 500;
    }

    /* review breakdown card has no inner padding bottom since cards handle spacing */
    #review-list { }

    #error {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      margin-top: 12px;
      text-align: center;
    }
  </style>
</head>
<body>

<header>
  <h1>Smart Review Analyzer</h1>
  <p>Google Maps Review Intelligence</p>
</header>

<div class="body">
  <button id="analyze-btn">Analyze Reviews</button>

  <div id="loading">
    <div class="spinner"></div>
    Analyzing reviews...
  </div>

  <div id="error">Could not find reviews. Make sure you are on a Google Maps place page.</div>

  <div id="results">

    <div class="card">
      <div class="card-label">Review Trust</div>
      <div class="trust-row">
        <span>Real Reviews</span>
        <span class="pill pill-real" id="real-count">0</span>
      </div>
      <div class="trust-row">
        <span>Fake Reviews</span>
        <span class="pill pill-fake" id="fake-count">0</span>
      </div>
      <div class="trust-row">
        <span>Suspicious</span>
        <span class="pill pill-suspicious" id="suspicious-count">0</span>
      </div>
    </div>

    <div class="card">
      <div class="card-label">Sentiment — Real Reviews Only</div>
      <div class="sentiment-row">
        <div class="sentiment-label">
          <span class="sent-pos">Positive</span>
          <span class="sent-pos sent-pct" id="positive-pct">0%</span>
        </div>
        <div class="bar-bg">
          <div class="bar-fill bar-positive" id="positive-bar" style="width:0%"></div>
        </div>
      </div>
      <div class="sentiment-row">
        <div class="sentiment-label">
          <span class="sent-neg">Negative</span>
          <span class="sent-neg sent-pct" id="negative-pct">0%</span>
        </div>
        <div class="bar-bg">
          <div class="bar-fill bar-negative" id="negative-bar" style="width:0%"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-label">Summary</div>
      <button id="summary-btn">Generate Summary</button>
      <div id="summary-loading">Generating...</div>
      <p id="summary-text"></p>
    </div>

    <div class="card">
      <div class="card-label">Review Breakdown</div>
      <div id="review-list"></div>
    </div>

  </div>
</div>

<script src="popup.js"></script>
</body>
</html>
